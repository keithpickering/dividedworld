# The SQL suite on a pull request once it is ready, and by hand: every migration replayed from
# zero into a scratch database on a Postgres service, then every assertion file under
# supabase/tests/ (tools/test-sql.mjs). It cannot live in build:ci, which has no database; the
# suite's refusal of any database but localhost is in the build (tools/test-sql-refusal.mjs).
#
# Postgres 17 here, as Supabase runs, pinned to one image (below); a session's container runs its
# distribution's Postgres.
# Same trigger shape as build.yml: a draft's push shows a skipped job, and a PR is run when it
# is marked ready. Carried from currents (docs/plans/port-manifest.md).
# The daily release calls it on its candidate (release.yml).
name: SQL
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['docs/**']
  workflow_dispatch:
  # The daily release (release.yml) calls this with the candidate it is releasing.
  workflow_call:
    inputs:
      ref: { type: string, required: true }
concurrency:
  group: sql-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  sql:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: sql (${{ matrix.shard }}/${{ strategy.job-total }})
    # The SQL suite is split into four shards (tools/test-sql.mjs --shard=i/n), each a pool of files at once on its own
    # runner, and every shard runs to its end (fail-fast off), so one failure never hides another. The total comes from
    # strategy.job-total, so the matrix is the one list: to add a shard, add a number to it (a fifth is one more entry).
    # tools/check-release-workflows.mjs (R16) holds that shape, and `sql-total` below holds the split itself: it reads
    # every shard's report and fails unless every file on disk ran.
    # The limit ends a job that will never end, and is the last of four: inside the suite a lock wait ends at 30s, a
    # statement at 300s and a file at 10 minutes (tools/test-sql.mjs), so a hang is ended long before this.
    # Measured on 2026-11-25 (docs/plans/2026-11-25-sql-suite-split-design.md, sections 1 and 7): the suite ran one file
    # after another in 41 minutes on main (release run 45610008489), and a PR's run was cancelled at 44. Each file now
    # runs on a clone of one replayed template, four files at once in a shard, and a shard is expected in 6 to 10 minutes
    # on a slow runner (issue #515: a slow runner's four CPUs do about two CPUs' work). 30 is about three times the
    # slowest shard, the figure the build and the e2e shards use. If a shard needs more, the number of shards changes,
    # not this limit. The limit before the split was 15 minutes (2026-11-12), then 45, then 75 as a stopgap until the
    # split (#587) landed; those figures were for one runner running the whole suite.
    timeout-minutes: 30
    services:
      postgres:
        # Named by digest, not by the `postgres:17` tag: that tag moved to 17.12 on 2026-11-12 and every run failed
        # on plan-dependent files (issue #596). Docker pulls by the digest; the tag only says which version it is.
        # tools/check-release-workflows.mjs (R8) holds this string identical in every workflow. To move it, a PR
        # of its own changes the string in both sql.yml and rehearsal.yml, and its sql and rehearsal jobs then run
        # on the new image.
        image: postgres:17.11@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env: { POSTGRES_PASSWORD: pg }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.ref }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      # Installed only when missing, so the day a runner image stops shipping it fails loudly here.
      - run: command -v psql >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends postgresql-client)
      - run: psql --version
      - run: npm ci --no-audit --no-fund
      - run: npm run test:sql -- --shard=${{ matrix.shard }}/${{ strategy.job-total }} --report=sql-report-${{ matrix.shard }}.json
        env:
          DATABASE_URL: postgres://postgres:pg@localhost:5432/postgres
      # It builds its own database and needs no split, so one shard runs it; a failed suite does not hide it.
      - run: node tools/test-sql-drift.mjs
        if: ${{ !cancelled() && matrix.shard == 1 }}
        env:
          DATABASE_URL: postgres://postgres:pg@localhost:5432/postgres
      # The shard's own report, on a failure as well: sql-total reads every shard's and fails on one that is missing.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sql-report-${{ matrix.shard }}
          path: sql-report-${{ matrix.shard }}.json
          if-no-files-found: error
  # The split cannot lose a file: this reads every shard's report and fails unless every file on disk ran, and it fails
  # when a shard was cancelled or never uploaded. It runs when a shard failed (always()), but not for a draft, as the
  # shards do not. It needs no database, only the repository's dependencies (tools/test-sql.mjs imports the web-reads
  # check, which imports typescript).
  sql-total:
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    needs: [sql]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.ref }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          pattern: sql-report-*
          merge-multiple: true
          path: sql-reports
      - run: node tools/test-sql.mjs --gather=sql-reports
      # A shard that was cancelled or skipped has no report, and the gather above says so; this says it from the
      # shards' own result, so that the job is red whatever the reports hold.
      - run: '[ "$SHARDS" = success ]'
        env: { SHARDS: '${{ needs.sql.result }}' }
