# The System rehearsal on a pull request once it is ready, and by hand: the tests that need Postgres and libfaketime
# (tools/rehearse/database/), then a two-day stub run of one scenario, whose directory (report.html, log.json) is uploaded.
# Outside the build, which has neither (tools/build.mjs); not called by the release. Same trigger shape as sql.yml.
# The rehearsal and its cluster tests start the runner's own Postgres binaries (under /usr/lib/postgresql/*) on a fake
# clock. The database client's test (tools/rehearse/database/db.test.ts) runs on DATABASE_URL instead, so the job also
# has the Postgres service sql.yml uses.
name: Rehearsal
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['docs/**']
  workflow_dispatch:
concurrency:
  group: rehearsal-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  rehearsal:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # Named by digest, the one string sql.yml holds and explains (tools/check-release-workflows.mjs, R8).
        image: postgres:17.11@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env: { POSTGRES_PASSWORD: pg }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      # Installed only when missing, so the day a runner image stops shipping them fails loudly here.
      - run: ls -d /usr/lib/postgresql/*/bin >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends postgresql)
      - run: ls /usr/lib/x86_64-linux-gnu/faketime/libfaketime.so.1 >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends faketime)
      - run: ls -d /usr/lib/postgresql/*/bin
      - run: npm ci --no-audit --no-fund
      - run: npm run test:rehearse
        env:
          DATABASE_URL: postgres://postgres:pg@localhost:5432/postgres
      - run: npm run rehearse -- small-circle-reign --stub --days 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rehearsal-small-circle-reign
          path: rehearsals/small-circle-reign
          if-no-files-found: warn
