# The web app's keyboard end-to-end flows on a pull request once it is ready, and by hand:
# Playwright against `vite preview` of a build on the in-memory backend (playwright.config.ts).
# It cannot live in build:ci, which has no browser (tools/build.mjs's OUTSIDE_THE_BUILD).
# Same trigger shape as build.yml: a draft's push shows a skipped job, and a PR is run when it
# is marked ready.
# The daily release calls it on its candidate (release.yml).
name: Web
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['docs/**']
  workflow_dispatch:
  # The daily release (release.yml) calls this with the candidate it is releasing.
  workflow_call:
    inputs:
      ref: { type: string, required: true }
concurrency:
  group: web-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # The suite outgrew one runner: 2,073 tests took 28 of the 30 minutes on 2026-11-05 (a11y.spec.ts alone 18), and a slow
    # setup ran one out. It is split by test (playwright.config.ts runs fully parallel, so a shard can split a spec) into
    # seven shards by count. Every shard runs to its end (fail-fast off), so one failure never hides another.
    # Measured on 2026-11-26: the suite was 5,502 tests (4,306 on 2026-11-13, when it went to six shards). With six, the
    # first five took 13 to 18 minutes and the sixth 23 to 26, and one run in eight (45746088304) cancelled it at the
    # limit with no test failed. The last shard by count holds the specs late in the alphabet, the slowest per test:
    # glass-text's 90-second budgets (#1150), list-rows, origin-effects, steel-chair, hot-box, graffiti and veils. Of
    # glass-text's 346 tests the sixth of six held 271; the sixth of seven holds 206 and the seventh 140.
    # The 30-minute limit is left above the slowest shard so that it still ends a hang. The total comes from
    # strategy.job-total, so the matrix is the one list: to add a shard, add a number to it.
    # tools/check-release-workflows.mjs holds that shape (issue #605).
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]
    name: e2e (${{ matrix.shard }}/${{ strategy.job-total }})
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.ref }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      # The runner has no browser of its own; CI is the one place one is downloaded.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env: { CI: '1' }
      # The board match's side-by-side pictures and mismatch lists (e2e/boards.spec.ts), on a pass as well: each shard's
      # own, for the boards that shard ran.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: board-match-report-${{ matrix.shard }}
          path: e2e/report/boards/
          if-no-files-found: ignore
