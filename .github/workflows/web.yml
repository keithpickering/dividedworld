# The web app's keyboard end-to-end flows on a pull request once it is ready, and by hand:
# Playwright against `vite preview` of a build on the in-memory backend (playwright.config.ts).
# It cannot live in build:ci, which has no browser (tools/build.mjs's OUTSIDE_THE_BUILD).
# Same trigger shape as build.yml: a draft's push shows a skipped job, and a PR is run when it
# is marked ready.
# The daily release calls it on its candidate (release.yml).
name: Web
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['docs/**']
  workflow_dispatch:
  # The daily release (release.yml) calls this with the candidate it is releasing.
  workflow_call:
    inputs:
      ref: { type: string, required: true }
concurrency:
  group: web-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # The suite runs a spec file to a worker, and a11y.spec.ts alone is about 11 minutes (1,153 tests in about 13 locally, 2026-11-02);
    # with the browser's download that outgrew 15. Thirty leaves room and still ends a hang.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.ref }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      # The runner has no browser of its own; CI is the one place one is downloaded.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env: { CI: '1' }
      # The board match's side-by-side pictures and mismatch lists (e2e/boards.spec.ts), on a pass as well.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: board-match-report
          path: e2e/report/boards/
          if-no-files-found: ignore
