# The web app's keyboard end-to-end flows on a pull request once it is ready, and by hand:
# Playwright against `vite preview` of a build on the in-memory backend (playwright.config.ts).
# It cannot live in build:ci, which has no browser (tools/build.mjs's OUTSIDE_THE_BUILD).
# Same trigger shape as build.yml: a draft's push shows a skipped job, and a PR is run when it
# is marked ready.
# The daily release calls it on its candidate (release.yml).
name: Web
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['docs/**']
  workflow_dispatch:
  # The daily release (release.yml) calls this with the candidate it is releasing.
  workflow_call:
    inputs:
      ref: { type: string, required: true }
concurrency:
  group: web-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # The suite outgrew one runner: 2,073 tests took 28 of the 30 minutes on 2026-11-05 (a11y.spec.ts alone 18), and a slow
    # setup ran one out. It is split by test (playwright.config.ts runs fully parallel, so a shard can split a spec) into
    # six shards by count. Every shard runs to its end (fail-fast off), so one failure never hides another.
    # Measured on 2026-11-13: the suite was 4,306 tests, an hour of work on the two workers a runner gives, and growing.
    # The last of three shards took 24:51 on a middling runner and 32 on a slow one, because the slow specs
    # (glass-layout, glass-text) come late in the alphabet; two shards were cancelled at the limit with no test failed.
    # By count, six shards put the slowest at about 15 minutes, and 20 on a slow runner, so the 30-minute limit is
    # twice the one and still ends a hang. The total comes from strategy.job-total, so the matrix is the one list: to
    # add a shard, add a number to it. tools/check-release-workflows.mjs holds that shape (issue #605).
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    name: e2e (${{ matrix.shard }}/${{ strategy.job-total }})
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.ref }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      # The runner has no browser of its own; CI is the one place one is downloaded.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env: { CI: '1' }
      # The board match's side-by-side pictures and mismatch lists (e2e/boards.spec.ts), on a pass as well: each shard's
      # own, for the boards that shard ran.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: board-match-report-${{ matrix.shard }}
          path: e2e/report/boards/
          if-no-files-found: ignore
