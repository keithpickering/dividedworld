# The web app's keyboard end-to-end flows on a pull request once it is ready, and by hand:
# Playwright against `vite preview` of a build on the in-memory backend (playwright.config.ts).
# It cannot live in build:ci, which has no browser (tools/build.mjs's OUTSIDE_THE_BUILD).
# Same trigger shape as build.yml: a draft's push shows a skipped job, and a PR is run when it
# is marked ready.
name: Web
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['docs/**']
  workflow_dispatch:
concurrency:
  group: web-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # The suite outgrew one runner: 2,073 tests took 28 of the 30 minutes on 2026-11-05 (a11y.spec.ts alone 18), and a slow
    # setup ran one out. It is split by test (playwright.config.ts runs fully parallel, so a shard can split a spec), three
    # ways, each about a third of the suite. Every shard runs to its end (fail-fast off), so one failure never hides another.
    # Thirty minutes still ends a hang.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: e2e (${{ matrix.shard }}/3)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      # The runner has no browser of its own; CI is the one place one is downloaded.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/3
        env: { CI: '1' }
      # The board match's side-by-side pictures and mismatch lists (e2e/boards.spec.ts), on a pass as well: each shard's
      # own, for the boards that shard ran.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: board-match-report-${{ matrix.shard }}
          path: e2e/report/boards/
          if-no-files-found: ignore
