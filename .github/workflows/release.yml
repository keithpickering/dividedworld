# The daily release (docs/plans/2026-11-05-daily-release-design.md). Production moves once a day, here, and nowhere
# else: the candidate is main's head when the run starts. It is built, its SQL suite and its e2e flows run, and only
# then does `production` fast-forward to it. Netlify builds `production`. A red job stops everything after it:
# production stays where it is, the run goes red and GitHub emails the owner, and `report` names the failed job.
# The fix goes forward. A dispatch, the owner's alone, always releases main's head. After the tests and before the
# site, three jobs deploy the backend (docs/plans/2026-11-12-release-backend-design.md): schema, functions and seed,
# in the `production` Environment, which holds the Supabase secrets. 22:13 PDT, 21:13 PST.
# tools/check-release-workflows.mjs holds this shape.
# Carried from currents' release.yml.
name: Release
on:
  schedule:
    - cron: '13 5 * * *'
  workflow_dispatch:
concurrency: { group: release, cancel-in-progress: false }
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      same: ${{ steps.pick.outputs.same }}
      previous: ${{ steps.pick.outputs.previous }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          prod=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/production" --jq .object.sha 2>/dev/null || true)
          # A missing ref (the first release) or an API error prints error JSON, not a SHA: only a
          # 40-character hex SHA is a previous production.
          case "$prod" in (*[!0-9a-f]*) prod="" ;; esac
          [ "${#prod}" -eq 40 ] || prod=""
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "previous=${prod}" >> "$GITHUB_OUTPUT"
          if [ "$sha" = "$prod" ]; then
            echo "same=true" >> "$GITHUB_OUTPUT"
            echo "Nothing to release: production is already at ${sha}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "same=false" >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: candidate
    if: needs.candidate.outputs.same != 'true'
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.candidate.outputs.sha }}
  sql:
    needs: [candidate, build]
    if: needs.candidate.outputs.same != 'true'
    uses: ./.github/workflows/sql.yml
    with:
      ref: ${{ needs.candidate.outputs.sha }}
  web:
    needs: [candidate, sql]
    if: needs.candidate.outputs.same != 'true'
    uses: ./.github/workflows/web.yml
    with:
      ref: ${{ needs.candidate.outputs.sha }}
  schema:
    needs: [candidate, web]
    if: needs.candidate.outputs.same != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.sha }}
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      # ubuntu-latest ships psql, which check-deployed-migrations needs. Asked for by name, so a
      # runner image without it fails here, before anything is touched, with a plain message.
      - run: psql --version
      # `--yes` answers db push's confirmation prompt, which has no terminal to read it from here.
      # Never --include-all: a migration older than the remote's newest that is missing remotely is
      # a problem for the owner (the --before check names it), not something to apply unseen.
      - env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -e
          node tools/check-deployed-migrations.mjs --db "$SUPABASE_DB_URL" --before
          npx supabase db push --yes --db-url "$SUPABASE_DB_URL"
          node tools/check-deployed-migrations.mjs --db "$SUPABASE_DB_URL" --after
  functions:
    needs: [candidate, schema]
    if: needs.candidate.outputs.same != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.sha }}
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      # The deploy overwrites and the CLI does not tell a transport failure from a refusal, so the
      # whole deploy is tried up to three times (design D8).
      - env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          for i in 1 2 3; do npx supabase functions deploy --use-api --project-ref "$SUPABASE_PROJECT_REF" && exit 0; [ "$i" = 3 ] || sleep $((i * 20)); done; exit 1
  seed:
    needs: [candidate, functions]
    if: needs.candidate.outputs.same != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.sha }}
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      # Only a 200 is green: curl's own --fail passes any 2xx or 3xx, and a 302 from the gateway
      # would seed nothing and let promote move the site. curl retries a timeout, a refused
      # connection, 408, 429 and 5xx by itself (D8), so the seed's 422 stops at once. The body (a
      # 422's problems) goes to the summary; curl's own errors stay in the log, which is masked.
      # `: > "$body"` because curl does not truncate the file on a transport failure.
      - env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          KAYFABB_JOBS_KEY: ${{ secrets.KAYFABB_JOBS_KEY }}
        run: |
          set -e
          body="${RUNNER_TEMP}/seed-body"
          : > "$body"
          code=$(curl -sS --retry 3 --retry-connrefused --max-time 120 -o "$body" -w '%{http_code}' -X POST "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/seed" -H "apikey: ${KAYFABB_JOBS_KEY}") || code=000
          {
            echo "## Seed"
            echo "The seed answered ${code}."
            echo '```'
            cat "$body"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$code" = 200 ] || { echo "the seed answered ${code}, not 200"; exit 1; }
  promote:
    needs: [candidate, seed]
    if: needs.candidate.outputs.same != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.candidate.outputs.sha }}
      # A fast-forward only: no force, so `production` can only move along main.
      - run: git push origin "${{ needs.candidate.outputs.sha }}:refs/heads/production"
  report:
    needs: [candidate, build, sql, web, schema, functions, seed, promote]
    if: always() && needs.candidate.result == 'success' && needs.candidate.outputs.same != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.candidate.outputs.sha }}
      - env:
          CANDIDATE: ${{ needs.candidate.outputs.sha }}
          PREVIOUS: ${{ needs.candidate.outputs.previous }}
          RESULTS: "build=${{ needs.build.result }} sql=${{ needs.sql.result }} web=${{ needs.web.result }} schema=${{ needs.schema.result }} functions=${{ needs.functions.result }} seed=${{ needs.seed.result }} promote=${{ needs.promote.result }}"
        run: |
          {
            echo "## Release of ${CANDIDATE}"
            if [ -n "$PREVIOUS" ]; then echo "Previous production: ${PREVIOUS}"; else echo "First release: no previous production."; fi
            echo
            echo "Jobs: ${RESULTS}"
            failed=$(echo "$RESULTS" | tr ' ' '\n' | grep -E '=(failure|cancelled)$' | cut -d= -f1 | tr '\n' ' ')
            if [ -n "$failed" ]; then echo; echo "**Held.** Production did not move. Failed: ${failed}"; fi
            echo
            echo "### Commits in this release"
            if [ -n "$PREVIOUS" ]; then range="${PREVIOUS}..${CANDIDATE}"; else range="-n 40 ${CANDIDATE}"; fi
            git log --first-parent --reverse --format='- %h %s' $range
          } >> "$GITHUB_STEP_SUMMARY"
