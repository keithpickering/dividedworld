# Divided World's Supabase project settings that the code relies on, for the local stack and
# `supabase config push`. A push writes the CLI's default for any setting left out, so every Auth
# setting a push would otherwise reset (where its links point) is set here too.
project_id = "dividedworld"

[auth]
# Where Auth's confirmation and reset links send a player.
site_url = "https://dw.gripe"
additional_redirect_urls = []
# Accounts open only through open_account() (supabase/migrations/0009_registration.sql), so a
# login made straight through Auth can do nothing; sign-up stays on for the account function.
enable_signup = true
minimum_password_length = 8

[auth.email]
# On, so Auth's own sign-up answers an address it already knows as it answers a new one, and a
# login is confirmed before it can open an account (supabase/functions/account/core.ts).
enable_signup = true
enable_confirmations = true
