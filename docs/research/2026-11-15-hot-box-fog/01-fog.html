<title>Hot Box fog bench</title>
<!--
  Record, written 2026-11-15. A throwaway bench for docs/plans/2026-11-15-hot-box-fog-design.md: three ways to draw
  Hot Box's smoke over one mock post, to judge by eye. Not product code.
    built : what PR #713 shipped (a flat fill, light and dark discs, a circular cut that follows the pointer)
    mock  : the Wave 1 design session's widget (70 soft puffs in one color, each pushed away from the pointer)
    fog   : the proposal (a low-resolution field of fog that the pointer drags and displaces, lit and shaded)
  ?auto=1 moves a pretend pointer along the lines, for screenshots. ?mode=built|mock|fog picks the mode.
-->

      if (still) { p.ox = tx; p.oy = ty; } else { p.ox += (tx - p.ox) * 0.08; p.oy += (ty - p.oy) * 0.08; }
      const x = p.x + p.ox, y = p.y + p.oy, g = ctx.createRadialGradient(x, y, 0, x, y, p.mr);
      g.addColorStop(0, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},.62)`); g.addColorStop(1, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},0)`);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, p.mr, 0, 7); ctx.fill();
    }
  }

  /* ------------------------------------------------------------------ the page ---- */
  function reset() {
    words.innerHTML = '';
    const paras = $('long').checked ? Array.from({ length: 60 }, (_, i) => PARAS[i % PARAS.length]) : PARAS;
    for (const p of paras) { const el = document.createElement('p'); el.textContent = p; words.append(el); }
    const r = body.getBoundingClientRect();
    W = r.width; H = r.height; dpr = Math.min(2, devicePixelRatio || 1);
    /* The bench keeps one canvas over the whole body (the build draws through the engine's tiles); only the rows near the view are stepped and drawn. */
    const scale = Math.min(dpr, Math.sqrt(16e6 / (W * H)));
    cv.width = Math.round(W * scale); cv.height = Math.round(H * scale); cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    Object.assign(state, { mouse: null, rest: [], touch: null, sweep: null });
    alloc(); seedPuffs(); box = null;
    const [c] = [$('col').value]; rgb = [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16));
    $('ageText').textContent = `${(3 * $('age').value / 100).toFixed(1)} of 3 days, ${fogAlpha().toFixed(2)}`;
    $('wakeText').textContent = `${($('wake').value / 10).toFixed(1)} s`; $('cellText').textContent = `${$('cell').value} px`;
    document.body.classList.toggle('dark', $('dark').checked);
  }
  for (const id of ['col', 'age', 'reduced', 'dark', 'long', 'wake', 'cell']) $(id).addEventListener('input', reset);
  addEventListener('resize', reset);

  const at = (e) => { const r = body.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  function moveTo(x, y, now) {
    const m = state.mouse;
    if (m) { const dt = Math.max(1, now - state.lastMove) / 1000, k = 0.5; state.pvx += ((x - m.x) / dt - state.pvx) * k; state.pvy += ((y - m.y) / dt - state.pvy) * k; }
    state.mouse = { x, y, openedAt: m ? m.openedAt : now, leftAt: null, hold: 0 }; state.lastMove = now;
  }
  body.addEventListener('pointermove', (e) => { if (e.pointerType !== 'touch') { const p = at(e); moveTo(p.x, p.y, performance.now()); } });
  body.addEventListener('pointerdown', (e) => { if (e.pointerType === 'touch') { const p = at(e), t = performance.now(); state.touch = { x: p.x, y: p.y, openedAt: t, leftAt: t, hold: SMOKE.touchHold }; } });
  body.addEventListener('pointerleave', (e) => { if (e.pointerType !== 'touch' && state.mouse) { state.rest.push({ ...state.mouse, leftAt: performance.now() }); state.mouse = null; state.pvx = state.pvy = 0; } });
  const hold = $('hold');
  const startSweep = () => { const lh = 19.5, lines = []; for (let y = 10 + lh / 2; y < H - 10; y += lh) lines.push(y); state.sweep = { startedAt: performance.now(), releasedAt: null, lines, lh }; };
  const stopSweep = () => { if (state.sweep && state.sweep.releasedAt === null) state.sweep.releasedAt = performance.now(); };
  hold.addEventListener('pointerdown', startSweep); hold.addEventListener('pointerup', stopSweep); hold.addEventListener('pointerleave', stopSweep);
  hold.addEventListener('keydown', (e) => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) startSweep(); }); hold.addEventListener('keyup', stopSweep);

  let last = performance.now(), acc = 0, frames = 0, shown = '';
  function frame(now) {
    const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
    if (q.get('auto')) { const s = now / 1000, line = Math.floor(s / 4) % 5; moveTo(40 + ((s % 4) / 4) * (W - 80), 30 + line * 22 + Math.sin(s * 3) * 4, now); }
    /* A pointer at rest drags nothing. */
    if (now - state.lastMove > 60) { state.pvx *= 0.6; state.pvy *= 0.6; }
    state.rest = state.rest.filter((c) => now < c.leftAt + c.hold + SMOKE.roll);
    if (state.sweep && state.sweep.releasedAt !== null && now > state.sweep.releasedAt + SMOKE.roll) state.sweep = null;
    const t0 = performance.now();
    ctx.clearRect(0, 0, W, H);
    let cells = 0, stepped = 0;
    if (mode === 'fog') {
      /* Only the rows within 256 px of the window are stepped and drawn, as the engine's tiles would mount them. */
      const r = body.getBoundingClientRect(), top = clamp(-r.top - 256, 0, H), bottom = clamp(innerHeight - r.top + 256, 0, H);
      const r0 = Math.floor(top / CELL), r1 = Math.min(gh, Math.ceil(bottom / CELL) + 1);
      if (r1 > r0) { stepped = $('reduced').checked ? 0 : step(dt, now, r0, r1); drawFog(now, now, r0, r1); cells = (r1 - r0) * gw; }
    } else if (mode === 'built') drawBuilt(now, now);
    else drawMock(now);
    acc += performance.now() - t0; frames++;
    if (frames === 30) { shown = `${mode}: ${(acc / 30).toFixed(2)} ms a frame in script${cells ? `, ${cells} cells of ${CELL} px drawn (${gw} x ${Math.round(cells / gw)}), ${stepped} stepped` : ''}; body ${Math.round(W)} x ${Math.round(H)} px`; acc = 0; frames = 0; $('stats').textContent = shown; }
    requestAnimationFrame(frame);
  }
  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
