<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Placeholder art for the cosmetics boards, 2026-11-04. The owner's own Minus World gear replaces every piece. -->
  <!-- A portrait cut 1:2: a figure on sky, as a player's own picture would stand. viewBox 100x200. -->
  <symbol id="portrait" viewBox="0 0 100 200">
    <rect width="100" height="200" fill="#8fd3f4"/>
    <rect y="150" width="100" height="50" fill="#5aa25a"/>
    <ellipse cx="50" cy="62" rx="22" ry="25" fill="#f2c9a0"/>
    <path d="M28 98 Q50 86 72 98 L80 160 L20 160 Z" fill="#3b5bdb"/>
    <rect x="30" y="158" width="16" height="36" fill="#222"/><rect x="54" y="158" width="16" height="36" fill="#222"/>
    <circle cx="42" cy="60" r="2.4" fill="#222"/><circle cx="58" cy="60" r="2.4" fill="#222"/>
    <path d="M42 75 Q50 80 58 75" stroke="#222" stroke-width="2" fill="none"/>
  </symbol>
  <!-- A portrait cut 1:1.4 -->
  <symbol id="portrait2" viewBox="0 0 100 140">
    <rect width="100" height="140" fill="#f4b6c2"/>
    <ellipse cx="50" cy="58" rx="24" ry="27" fill="#c99366"/>
    <path d="M22 100 Q50 88 78 100 L86 140 L14 140 Z" fill="#2f9e44"/>
    <circle cx="41" cy="56" r="2.4" fill="#222"/><circle cx="59" cy="56" r="2.4" fill="#222"/>
    <path d="M42 72 L58 72" stroke="#222" stroke-width="2"/>
  </symbol>
  <symbol id="g-cap" viewBox="0 0 100 60">
    <path d="M14 46 Q14 6 50 6 Q86 6 86 46 Z" fill="#e03131"/>
    <path d="M60 42 Q98 40 100 52 Q80 56 56 50 Z" fill="#c92a2a"/>
    <rect x="12" y="42" width="76" height="8" fill="#fff"/>
    <circle cx="50" cy="8" r="4" fill="#fff"/>
  </symbol>
  <symbol id="g-stache" viewBox="0 0 100 34">
    <path d="M50 10 Q34 0 18 10 Q6 18 0 12 Q4 30 26 28 Q42 26 50 18 Q58 26 74 28 Q96 30 100 12 Q94 18 82 10 Q66 0 50 10 Z" fill="#3b2412"/>
  </symbol>
  <symbol id="g-shades" viewBox="0 0 100 30">
    <rect x="2" y="4" width="40" height="22" rx="6" fill="#111"/><rect x="58" y="4" width="40" height="22" rx="6" fill="#111"/>
    <rect x="40" y="10" width="20" height="4" fill="#111"/>
    <path d="M8 9 L20 9" stroke="#fff" stroke-width="2" opacity=".6"/>
  </symbol>
  <symbol id="g-button" viewBox="0 0 60 60">
    <circle cx="30" cy="30" r="28" fill="#ffd43b" stroke="#222" stroke-width="3"/>
    <text x="30" y="27" text-anchor="middle" font-family="Verdana" font-weight="bold" font-size="9" fill="#222">I REALLY</text>
    <text x="30" y="38" text-anchor="middle" font-family="Verdana" font-weight="bold" font-size="7" fill="#222">WISH I WEREN'T</text>
    <text x="30" y="47" text-anchor="middle" font-family="Verdana" font-weight="bold" font-size="7" fill="#222">HERE</text>
  </symbol>
  <symbol id="g-tophat" viewBox="0 0 80 90">
    <rect x="16" y="4" width="48" height="70" fill="#212529"/><rect x="16" y="54" width="48" height="10" fill="#7048e8"/>
    <rect x="0" y="72" width="80" height="12" rx="4" fill="#212529"/>
  </symbol>
  <!-- trophies: small 2003 badge art, 24x24 -->
  <symbol id="t-gold" viewBox="0 0 24 24"><path d="M5 3h14v4a7 7 0 0 1-14 0z" fill="#f1c40f" stroke="#000"/><rect x="10" y="14" width="4" height="4" fill="#f1c40f" stroke="#000"/><rect x="7" y="18" width="10" height="3" fill="#000"/></symbol>
  <symbol id="t-silver" viewBox="0 0 24 24"><path d="M5 3h14v4a7 7 0 0 1-14 0z" fill="#ced4da" stroke="#000"/><rect x="10" y="14" width="4" height="4" fill="#ced4da" stroke="#000"/><rect x="7" y="18" width="10" height="3" fill="#000"/></symbol>
  <symbol id="t-pet" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ff6b6b" stroke="#000"/><path d="M12 17 L6 11 a3 3 0 0 1 6 -3 a3 3 0 0 1 6 3 Z" fill="#fff"/></symbol>
  <symbol id="t-demand" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" fill="#69db7c" stroke="#000"/><path d="M7 12 l4 4 l7 -9" stroke="#000" stroke-width="2.5" fill="none"/></symbol>
  <symbol id="t-sprite" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" fill="#748ffc" stroke="#000"/><rect x="8" y="7" width="3" height="3" fill="#fff"/><rect x="13" y="7" width="3" height="3" fill="#fff"/><rect x="7" y="14" width="10" height="3" fill="#fff"/></symbol>
  <symbol id="t-belt" viewBox="0 0 48 24"><rect x="0" y="7" width="48" height="10" fill="#5c3d1e" stroke="#000"/><ellipse cx="24" cy="12" rx="11" ry="10" fill="#f1c40f" stroke="#000"/><path d="M24 5 l2 5 h5 l-4 3 l2 5 l-5 -3 l-5 3 l2 -5 l-4 -3 h5 z" fill="#c92a2a"/></symbol>
</svg>
