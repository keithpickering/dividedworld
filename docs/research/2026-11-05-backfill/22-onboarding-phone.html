<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1250">
<title>Onboarding on a phone: the backfill board</title>
<!-- A board of the backfill design session (docs/plans/2026-11-05-backfill-boards-design.md), 1250 by 884, drawn on
     #202's head (c2553b3). Three phone screens at 390 by 844: the welcome letter scrolled to Before you start, each setting a full-width row whose options wrap whole (no option breaks inside its label, no note squeezed beside them); the guide with its contents folded; the tour's second step as a sheet over the HUD, the mask's name whole. A reference for the look, not code to copy. Written by gen.mjs in this folder. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,700;1,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #ffffff;outline-offset:3px}
.tab{display:flex;align-items:center;min-height:52px;padding:0 20px;white-space:nowrap;transform:skewX(-10deg);text-decoration:none;font:800 21px 'Barlow Condensed',sans-serif;letter-spacing:2px;color:#e4def7}
.many .tab{padding:0 13px;letter-spacing:1.5px}
.tab b{display:inline-block;transform:skewX(10deg);font-weight:800}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 26px;transform:skewX(-10deg);text-decoration:none;border:1px solid rgba(241,236,255,.6);background:none;cursor:pointer;font:800 21px 'Barlow Condensed',sans-serif;letter-spacing:2px;color:#f1ecff}
.btn b{display:inline-block;transform:skewX(10deg);font-weight:800}
.btn.primary{background:#19e3ff;border-color:#19e3ff;color:#03141a;box-shadow:0 0 18px rgba(25,227,255,.6)}
.btn.big{min-height:64px;padding:0 34px;font:400 30px Anton,Impact,sans-serif;letter-spacing:1px}
.btn.big b{font-weight:400}
.btns{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.lead{margin:0;max-width:680px;font:600 21px/1.5 'Barlow Condensed',sans-serif;color:#f1ecff}
.note{margin:12px 0 0;max-width:680px;font:500 21px/1.5 'Barlow Condensed',sans-serif;color:#e4def7}
.row{display:grid;grid-template-columns:230px 1fr;column-gap:32px;padding:24px 0;border-top:1px solid rgba(241,236,255,.22)}
.row h3,.k{margin:0;padding-top:12px;font:800 24px/1.1 'Barlow Condensed',sans-serif;letter-spacing:1.5px}
.field label{display:block;margin:0 0 10px;font:800 24px/1.1 'Barlow Condensed',sans-serif;letter-spacing:1.5px}
.field input[type=email],.field input[type=text]{box-sizing:border-box;width:100%;height:56px;padding:0 16px;background:rgba(18,12,36,.9);border:1px solid #19e3ff;color:#f1ecff;font:600 22px 'Barlow Condensed',sans-serif}
.check{display:flex;gap:16px;align-items:center;min-height:52px;cursor:pointer;font:700 22px 'Barlow Condensed',sans-serif}
.check input{width:30px;height:30px;margin:0;accent-color:#19e3ff;flex:none}
.aside h2{margin:0 0 10px;font:800 24px/1.1 'Barlow Condensed',sans-serif;letter-spacing:1.5px;color:#f1ecff}
.aside p{margin:0 0 18px;font:500 21px/1.5 'Barlow Condensed',sans-serif;color:#e4def7}
.aside section+section{margin-top:34px;padding-top:30px;border-top:1px solid rgba(241,236,255,.22)}
.lnk{font:700 21px 'Barlow Condensed',sans-serif;color:#c9f8ff;text-decoration-thickness:2px;text-underline-offset:4px}
.seg{display:flex;flex-wrap:wrap;gap:10px}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{display:inline-flex;align-items:center;min-height:52px;padding:0 22px;transform:skewX(-10deg);border:1px solid rgba(241,236,255,.6);font:800 21px 'Barlow Condensed',sans-serif;letter-spacing:1.5px;color:#f1ecff}
.seg span b{display:inline-block;transform:skewX(10deg);font-weight:800}
.seg input:checked + span{background:#19e3ff;border-color:#19e3ff;color:#03141a;box-shadow:0 0 18px rgba(25,227,255,.6)}
.piece{border:1.5px solid rgba(201,248,255,.55);background:rgba(7,5,13,.92);clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,22px 100%,0 calc(100% - 22px))}
.by{display:flex;gap:18px;align-items:center}
.by img{width:76px;height:76px;border:2px solid #a78bfa;image-rendering:pixelated}
.by b{display:block;font:34px/1 Anton,Impact,sans-serif;letter-spacing:.5px}
.by span{font:600 20px 'Barlow Condensed',sans-serif;color:#e4def7}
.body p{margin:0 0 16px;font:500 21px/1.55 'Barlow Condensed',sans-serif;color:#f1ecff;max-width:760px}
.rail p{margin:0;font:500 20px/1.5 'Barlow Condensed',sans-serif;color:#e4def7}
.rail h3{margin:0 0 4px;font:700 21px 'Barlow Condensed',sans-serif;color:#f1ecff}
.rail section{padding:16px 0;border-top:1px solid rgba(241,236,255,.22)}
</style>
</head>
<body>
<div style="width: 1250px; height: 884px; display: flex; gap: 20px; padding: 20px; box-sizing: border-box; background: #2a2833; font-family: 'Barlow Condensed', sans-serif">
  <figure aria-label="Welcome, Before you start" style="margin: 0; width: 390px; height: 844px; position: relative; overflow: hidden; background: #07050d; color: #f1ecff; flex: none">
    <svg aria-hidden="true" width="390" height="844" style="position: absolute; left: 0; top: 0">
    <defs>
      <filter id="sAq1" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.0022 0.004" numOctaves="5" seed="23"></feTurbulence><feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.14  0 0 0 0 0.98  1.8 0 0 0 -0.74"></feColorMatrix><feGaussianBlur stdDeviation="18"></feGaussianBlur></filter>
      <filter id="sBq1" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.003 0.005" numOctaves="4" seed="61"></feTurbulence><feColorMatrix type="matrix" values="0 0 0 0 0.08  0 0 0 0 0.85  0 0 0 0 1  0 2 0 0 -1.0"></feColorMatrix><feGaussianBlur stdDeviation="18"></feGaussianBlur></filter>
      <filter id="softq1" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="30"></feGaussianBlur></filter>
      <mask id="calmq1" maskUnits="userSpaceOnUse" x="0" y="0" width="390" height="844">
        <rect width="390" height="844" fill="#ffffff"></rect>
        <rect x="0" y="130" width="390" height="714" fill="#000000" opacity="0.92" filter="url(#softq1)"></rect>
      </mask>
    </defs>
    <g mask="url(#calmq1)">
      <rect width="390" height="844" filter="url(#sAq1)" opacity="0.95"></rect>
      <rect width="390" height="844" filter="url(#sBq1)" opacity="0.5"></rect>
    </g>
  </svg>
    <nav aria-label="Menu" style="position: absolute; left: 0; right: 0; top: 0; height: 124px; z-index: 5; background: rgba(7,5,13,.9); border-bottom: 1px solid rgba(201,248,255,.5); box-shadow: 0 1px 16px rgba(25,227,255,.35)">
      <a href="#" class="tab" style="position: absolute; left: 12px; top: 12px; border: 1px solid #ffffff; color: #ffffff; min-height: 46px; font-size: 20px"><b>&lsaquo; BACK TO THE BOARD</b></a>
      <div style="position: absolute; left: 0; right: 0; top: 66px; display: flex; overflow: hidden; padding-left: 12px"><a href="#" class="tab" style="min-height: 52px; padding: 0 12px; font-size: 19px"><b>ALERTS</b></a><a href="#" class="tab" style="min-height: 52px; padding: 0 12px; font-size: 19px"><b>VENDING MACHINE</b></a><a href="#" class="tab" style="min-height: 52px; padding: 0 12px; font-size: 19px"><b>MY CHARACTERS</b></a><a href="#" class="tab" style="min-height: 52px; padding: 0 12px; font-size: 19px"><b>SEASON</b></a><a href="#" class="tab" style="min-height: 52px; padding: 0 12px; font-size: 19px"><b>MY LOG</b></a><a href="#" class="tab" style="min-height: 52px; padding: 0 12px; font-size: 19px"><b>GUIDE</b></a></div>
    </nav>
    <section style="position: absolute; left: 16px; top: 140px; width: 358px">
      <h2 style="margin: 0 0 6px; font: 38px/1 Anton, Impact, sans-serif">BEFORE YOU START</h2>
      <p class="note" style="margin: 0 0 14px; font-size: 20px">How the board and the glass look and move. None of it changes how the game plays.</p>
      <div style="padding: 16px 0; border-top: 1px solid rgba(241,236,255,.22)"><div class="k" style="padding: 0 0 12px; font-size: 22px">THEME</div><div class="seg" style="gap: 8px"><label><input type="radio" name="pTHEME" checked><span style="min-height: 48px; padding: 0 16px; font-size: 19px; white-space: nowrap"><b>FOLLOW MY DEVICE</b></span></label><label><input type="radio" name="pTHEME"><span style="min-height: 48px; padding: 0 16px; font-size: 19px; white-space: nowrap"><b>BLACK ON WHITE</b></span></label><label><input type="radio" name="pTHEME"><span style="min-height: 48px; padding: 0 16px; font-size: 19px; white-space: nowrap"><b>WHITE ON BLACK</b></span></label></div></div>
      <p class="note" style="margin: -4px 0 6px; font-size: 19px">The 2003 board stays 2003 whichever you choose. Only its colors swap.</p>
      <div style="padding: 16px 0; border-top: 1px solid rgba(241,236,255,.22)"><div class="k" style="padding: 0 0 12px; font-size: 22px">MOTION</div><div class="seg" style="gap: 8px"><label><input type="radio" name="pMOTION" checked><span style="min-height: 48px; padding: 0 16px; font-size: 19px; white-space: nowrap"><b>FOLLOW MY DEVICE</b></span></label><label><input type="radio" name="pMOTION"><span style="min-height: 48px; padding: 0 16px; font-size: 19px; white-space: nowrap"><b>REDUCED</b></span></label><label><input type="radio" name="pMOTION"><span style="min-height: 48px; padding: 0 16px; font-size: 19px; white-space: nowrap"><b>FULL</b></span></label></div></div>
      <p class="note" style="margin: -4px 0 6px; font-size: 19px">Reduced stops the drifting smoke, the pulses and the orb shine. A card's effect stays: Stick Around still snaps you back, only instantly.</p>
      <div style="padding: 16px 0; border-top: 1px solid rgba(241,236,255,.22)"><div class="k" style="padding: 0 0 12px; font-size: 22px">TEXT SIZE</div><div class="seg" style="gap: 8px"><label><input type="radio" name="pTEXT SIZE" checked><span style="min-height: 48px; padding: 0 16px; font-size: 19px; white-space: nowrap"><b>100%</b></span></label><label><input type="radio" name="pTEXT SIZE"><span style="min-height: 48px; padding: 0 16px; font-size: 19px; white-space: nowrap"><b>125%</b></span></label><label><input type="radio" name="pTEXT SIZE"><span style="min-height: 48px; padding: 0 16px; font-size: 19px; white-space: nowrap"><b>150%</b></span></label><label><input type="radio" name="pTEXT SIZE"><span style="min-height: 48px; padding: 0 16px; font-size: 19px; white-space: nowrap"><b>200%</b></span></label></div></div>
    </section>
  </figure>
  <figure aria-label="The guide" style="margin: 0; width: 390px; height: 844px; position: relative; overflow: hidden; background: #07050d; color: #f1ecff; flex: none">
    <svg aria-hidden="true" width="390" height="844" style="position: absolute; left: 0; top: 0">
    <defs>
      <filter id="sAq2" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.0022 0.004" numOctaves="5" seed="23"></feTurbulence><feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.14  0 0 0 0 0.98  1.8 0 0 0 -0.74"></feColorMatrix><feGaussianBlur stdDeviation="18"></feGaussianBlur></filter>
      <filter id="sBq2" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.003 0.005" numOctaves="4" seed="61"></feTurbulence><feColorMatrix type="matrix" values="0 0 0 0 0.08  0 0 0 0 0.85  0 0 0 0 1  0 2 0 0 -1.0"></feColorMatrix><feGaussianBlur stdDeviation="18"></feGaussianBlur></filter>
      <filter id="softq2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="30"></feGaussianBlur></filter>
      <mask id="calmq2" maskUnits="userSpaceOnUse" x="0" y="0" width="390" height="844">
        <rect width="390" height="844" fill="#ffffff"></rect>
        <rect x="0" y="280" width="390" height="520" fill="#000000" opacity="0.92" filter="url(#softq2)"></rect>
      </mask>
    </defs>
    <g mask="url(#calmq2)">
      <rect width="390" height="844" filter="url(#sAq2)" opacity="0.95"></rect>
      <rect width="390" height="844" filter="url(#sBq2)" opacity="0.5"></rect>
    </g>
  </svg>
    <nav aria-label="Menu" style="position: absolute; left: 0; right: 0; top: 0; height: 124px; z-index: 5; background: rgba(7,5,13,.9); border-bottom: 1px solid rgba(201,248,255,.5); box-shadow: 0 1px 16px rgba(25,227,255,.35)">
      <a href="#" class="tab" style="position: absolute; left: 12px; top: 12px; border: 1px solid #ffffff; color: #ffffff; min-height: 46px; font-size: 20px"><b>&lsaquo; BACK TO THE BOARD</b></a>
      <div style="position: absolute; left: 0; right: 0; top: 66px; display: flex; overflow: hidden; padding-left: 12px"><a href="#" class="tab" style="min-height: 52px; padding: 0 12px; font-size: 19px"><b>ALERTS</b></a><a href="#" class="tab" style="min-height: 52px; padding: 0 12px; font-size: 19px"><b>VENDING MACHINE</b></a><a href="#" class="tab" style="min-height: 52px; padding: 0 12px; font-size: 19px"><b>MY CHARACTERS</b></a><a href="#" class="tab" style="min-height: 52px; padding: 0 12px; font-size: 19px"><b>SEASON</b></a><a href="#" class="tab" style="min-height: 52px; padding: 0 12px; font-size: 19px"><b>MY LOG</b></a><a href="#" class="tab" style="min-height: 52px; padding: 0 12px; font-size: 19px; background: rgba(25,227,255,.16); box-shadow: inset 0 -3px 0 #19e3ff; color: #ffffff"><b>GUIDE</b></a></div>
    </nav>
    <h1 style="position: absolute; left: 16px; top: 140px; width: 358px; margin: 0; font: 64px/1 Anton, Impact, sans-serif; letter-spacing: .5px; text-shadow: 0 0 24px rgba(25,227,255,.35)">STRATEGY<br>GUIDE</h1>
    <section style="position: absolute; left: 16px; top: 290px; width: 358px">
      <p class="lead" style="font-size: 20px">How the game works, from the people who made it. The voice is Gabe's; every fact in it is true, and every number is today's.</p>
      <button style="margin-top: 16px; width: 100%; height: 50px; display: flex; justify-content: space-between; align-items: center; padding: 0 14px; background: rgba(7,5,13,.9); border: 1px solid #19e3ff; color: #f1ecff; font: 800 20px 'Barlow Condensed', sans-serif; letter-spacing: 1.5px">CONTENTS &middot; CLASSES <span aria-hidden="true">&#x2304;</span></button>
      <h2 style="margin: 26px 0 10px; font: 44px/1 Anton, Impact, sans-serif">Classes</h2>
      <p class="note" style="font-size: 20px">Every character has one, and only you can see it. A class decides which corners of the reaction grid pay your character and which ones cost it.</p>
    </section>
  </figure>
  <figure aria-label="The tour, step 2" style="margin: 0; width: 390px; height: 844px; position: relative; overflow: hidden; background: #ffffff; flex: none; font-family: 'Barlow Condensed', sans-serif">
    <div aria-hidden="true" style="position: absolute; inset: 0; filter: blur(4px)"><div style="padding: 12px 10px; font: 700 17px 'Courier New', monospace; letter-spacing: 3px; border-bottom: 1px solid #000">DIVIDED WORLD</div><div style="margin: 20px 8px; height: 200px; border: 1px solid #000"></div></div>
    <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(7,5,13,.62)"></div>
    <section role="dialog" aria-label="These are your orbs" class="piece" style="position: absolute; left: 8px; right: 8px; top: 432px; padding: 18px 16px; background: #07050d; border-color: #a78bfa; color: #f1ecff">
      <div class="by"><img src="../2026-11-02-onboarding/assets/gabe-avatar.png" alt="" style="width: 48px; height: 48px"><div><b style="font-size: 28px">THESE ARE YOUR ORBS</b><span style="font-weight: 800; letter-spacing: 2px; color: #c4b5fd">GABE &middot; THE HUD, 2 OF 3</span></div></div>
      <p style="margin: 12px 0 14px; font: 500 19px/1.45 'Barlow Condensed', sans-serif">Reactions to your characters fill them at the settlement. Until then, hatched fill shows where you're headed. There is a most you can hold, so spend it.</p>
      <div class="btns" style="justify-content: flex-end"><button class="btn" style="min-height: 46px; padding: 0 16px"><b>SKIP ALL TIPS</b></button><button class="btn primary" style="min-height: 46px; padding: 0 18px"><b>GOT IT</b></button></div>
    </section>
    <section aria-label="Game HUD" style="position: absolute; left: 0; right: 0; bottom: 0; height: 128px; background: linear-gradient(#140c2c, #07050d); border-top: 1.5px solid rgba(201,248,255,.7); color: #f1ecff">
      <div style="position: absolute; left: 12px; top: 10px; width: 44px; height: 44px; border: 2px solid #19e3ff; display: grid; place-items: center; font: 28px Anton, Impact, sans-serif; opacity: .5">N</div>
      <div style="position: absolute; left: 66px; top: 6px; opacity: .5"><div style="font: 800 15px 'Barlow Condensed', sans-serif; letter-spacing: 2px">POSTING AS</div><div style="font: 24px/1.1 Anton, Impact, sans-serif">NEWCOMER &#x2304;</div></div>
      <div style="position: absolute; left: 6px; right: 6px; top: 66px; height: 54px; border: 2px solid #19e3ff; box-shadow: 0 0 18px rgba(25,227,255,.55); display: flex; align-items: center; gap: 6px; padding: 0 8px"><span style="width: 32px; height: 32px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #4a4466, #0d0a18)"></span><span style="width: 32px; height: 32px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #4a4466, #0d0a18)"></span><span style="width: 32px; height: 32px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #4a4466, #0d0a18)"></span><span style="width: 32px; height: 32px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #4a4466, #0d0a18)"></span><span style="width: 32px; height: 32px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #4a4466, #0d0a18)"></span><span style="width: 32px; height: 32px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #4a4466, #0d0a18)"></span><b style="margin-left: auto; font: 34px Anton, Impact, sans-serif">0.00</b></div>
    </section>
  </figure>
</div>
</body>
</html>
