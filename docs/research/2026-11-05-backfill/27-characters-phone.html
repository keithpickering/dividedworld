<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1660">
<title>Characters on a phone: the backfill board</title>
<!-- A board of the backfill design session (docs/plans/2026-11-05-backfill-boards-design.md), 1660 by 884, drawn on
     #202's head (c2553b3). Four phone screens at 390 by 844: New character at its class carousel, the Debut dialog as a sheet, Edit profile, and My characters' title with its count on a line of its own. A reference for the look, not code to copy. Written by gen.mjs in this folder. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,700;1,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #ffffff;outline-offset:3px}
.tab{display:flex;align-items:center;min-height:52px;padding:0 20px;white-space:nowrap;transform:skewX(-10deg);text-decoration:none;font:800 21px 'Barlow Condensed',sans-serif;letter-spacing:2px;color:#e4def7}
button.tab{background:none;border:0;cursor:pointer}
.many .tab{padding:0 13px;letter-spacing:1.5px}
.tab b{display:inline-block;transform:skewX(10deg);font-weight:800}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 26px;transform:skewX(-10deg);text-decoration:none;border:1px solid rgba(241,236,255,.6);background:none;cursor:pointer;font:800 21px 'Barlow Condensed',sans-serif;letter-spacing:2px;color:#f1ecff}
.btn b{display:inline-block;transform:skewX(10deg);font-weight:800}
.btn.primary{background:#19e3ff;border-color:#19e3ff;color:#03141a;box-shadow:0 0 18px rgba(25,227,255,.6)}
.btn.big{min-height:64px;padding:0 34px;font:400 30px Anton,Impact,sans-serif;letter-spacing:1px}
.btn.big b{font-weight:400}
.btns{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.lead{margin:0;max-width:680px;font:600 21px/1.5 'Barlow Condensed',sans-serif;color:#f1ecff}
.note{margin:12px 0 0;max-width:680px;font:500 21px/1.5 'Barlow Condensed',sans-serif;color:#e4def7}
.row{display:grid;grid-template-columns:230px 1fr;column-gap:32px;padding:24px 0;border-top:1px solid rgba(241,236,255,.22)}
.row h3,.k{margin:0;padding-top:12px;font:800 24px/1.1 'Barlow Condensed',sans-serif;letter-spacing:1.5px}
.field label{display:block;margin:0 0 10px;font:800 24px/1.1 'Barlow Condensed',sans-serif;letter-spacing:1.5px}
.field input[type=email],.field input[type=text]{box-sizing:border-box;width:100%;height:56px;padding:0 16px;background:rgba(18,12,36,.9);border:1px solid #19e3ff;color:#f1ecff;font:600 22px 'Barlow Condensed',sans-serif}
.check{display:flex;gap:16px;align-items:center;min-height:52px;cursor:pointer;font:700 22px 'Barlow Condensed',sans-serif}
.check input{width:30px;height:30px;margin:0;accent-color:#19e3ff;flex:none}
.aside h2{margin:0 0 10px;font:800 24px/1.1 'Barlow Condensed',sans-serif;letter-spacing:1.5px;color:#f1ecff}
.aside p{margin:0 0 18px;font:500 21px/1.5 'Barlow Condensed',sans-serif;color:#e4def7}
.aside section+section{margin-top:34px;padding-top:30px;border-top:1px solid rgba(241,236,255,.22)}
.lnk{font:700 21px 'Barlow Condensed',sans-serif;color:#c9f8ff;text-decoration-thickness:2px;text-underline-offset:4px}
.seg{display:flex;flex-wrap:wrap;gap:10px}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{display:inline-flex;align-items:center;min-height:52px;padding:0 22px;transform:skewX(-10deg);border:1px solid rgba(241,236,255,.6);font:800 21px 'Barlow Condensed',sans-serif;letter-spacing:1.5px;color:#f1ecff}
.seg span b{display:inline-block;transform:skewX(10deg);font-weight:800}
.seg input:checked + span{background:#19e3ff;border-color:#19e3ff;color:#03141a;box-shadow:0 0 18px rgba(25,227,255,.6)}
.piece{--cut:22px;--edge:rgba(201,248,255,.55);--ground:rgba(7,5,13,.94);position:relative;isolation:isolate;background:var(--edge);clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)))}
.piece::before{content:'';position:absolute;z-index:-1;inset:1.5px;background:var(--ground);clip-path:polygon(0 0,calc(100% - var(--cut) + .62px) 0,100% calc(var(--cut) - .62px),100% 100%,calc(var(--cut) - .62px) 100%,0 calc(100% - var(--cut) + .62px))}
.by{display:flex;gap:18px;align-items:center}
.by img{width:76px;height:76px;border:2px solid #a78bfa;image-rendering:pixelated}
.by b{display:block;font:34px/1 Anton,Impact,sans-serif;letter-spacing:.5px}
.by span{font:600 20px 'Barlow Condensed',sans-serif;color:#e4def7}
.body p{margin:0 0 16px;font:500 21px/1.55 'Barlow Condensed',sans-serif;color:#f1ecff;max-width:760px}
.rail p{margin:0;font:500 20px/1.5 'Barlow Condensed',sans-serif;color:#e4def7}
.rail h3{margin:0 0 4px;font:700 21px 'Barlow Condensed',sans-serif;color:#f1ecff}
.rail section{padding:16px 0;border-top:1px solid rgba(241,236,255,.22)}
.opt{position:relative;display:block;box-sizing:border-box;padding:16px 18px 16px 52px;border:1px solid rgba(241,236,255,.45);background:rgba(7,5,13,.6);cursor:pointer}
.opt input{position:absolute;left:18px;top:19px;width:22px;height:22px;margin:0;accent-color:#19e3ff}
.opt b{display:block;font:800 21px 'Barlow Condensed',sans-serif;letter-spacing:1.5px}
.opt span{display:block;margin-top:4px;font:500 20px/1.4 'Barlow Condensed',sans-serif;color:#e4def7}
.opt.on{border:2px solid #19e3ff;background:rgba(25,227,255,.08);box-shadow:0 0 18px rgba(25,227,255,.35)}
.sec{margin:0 0 14px;font:800 22px 'Barlow Condensed',sans-serif;letter-spacing:3px}
.count{display:flex;justify-content:space-between;margin-top:8px;font:500 19px 'Barlow Condensed',sans-serif;color:#e4def7}
.cls{position:relative;flex:none;box-sizing:border-box;width:236px;padding:18px 18px 20px;border:1px solid var(--c);background:rgba(7,5,13,.7)}
.cls h4{margin:0 30px 0 0;font:38px/1 Anton,Impact,sans-serif;color:var(--c)}
.cls p{margin:12px 0 0;font:500 20px/1.45 'Barlow Condensed',sans-serif;color:#f1ecff}
.cls p.hurt{color:#ff8fb1}
.cls input{position:absolute;right:16px;top:20px;width:22px;height:22px;margin:0;accent-color:#19e3ff}
.cls.on{border:2px solid #19e3ff;box-shadow:0 0 18px rgba(25,227,255,.4);background:rgba(25,227,255,.07)}
.preview{border:1.5px solid rgba(201,248,255,.7);box-shadow:0 0 14px rgba(25,227,255,.3);background:#fff;color:#000;display:grid;grid-template-columns:160px 1fr;font:12px/1.45 Verdana,sans-serif}
.preview>div{padding:8px 10px}
.preview>div+div{border-left:1px solid #000}
.sel{box-sizing:border-box;height:56px;padding:0 16px;background:rgba(18,12,36,.9);border:1px solid #19e3ff;color:#f1ecff;font:700 21px 'Barlow Condensed',sans-serif}
</style>
</head>
<body>
<div style="width: 1660px; height: 884px; display: flex; gap: 20px; padding: 20px; box-sizing: border-box; background: #2a2833; font-family: 'Barlow Condensed', sans-serif">
  <figure aria-label="New character" style="margin: 0; width: 390px; height: 844px; position: relative; overflow: hidden; background: #07050d; color: #f1ecff; flex: none">
    <svg aria-hidden="true" width="390" height="844" style="position: absolute; left: 0; top: 0">
    <defs>
      <filter id="sAr1" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.0022 0.004" numOctaves="5" seed="23"></feTurbulence><feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.14  0 0 0 0 0.98  1.8 0 0 0 -0.74"></feColorMatrix><feGaussianBlur stdDeviation="18"></feGaussianBlur></filter>
      <filter id="sBr1" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.003 0.005" numOctaves="4" seed="61"></feTurbulence><feColorMatrix type="matrix" values="0 0 0 0 0.08  0 0 0 0 0.85  0 0 0 0 1  0 2 0 0 -1.0"></feColorMatrix><feGaussianBlur stdDeviation="18"></feGaussianBlur></filter>
      <filter id="softr1" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="30"></feGaussianBlur></filter>
      <mask id="calmr1" maskUnits="userSpaceOnUse" x="0" y="0" width="390" height="844">
        <rect width="390" height="844" fill="#ffffff"></rect>
        <rect x="0" y="80" width="390" height="760" fill="#000000" opacity="0.9" filter="url(#softr1)"></rect>
      </mask>
    </defs>
    <g mask="url(#calmr1)">
      <rect width="390" height="844" filter="url(#sAr1)" opacity="0.95"></rect>
      <rect width="390" height="844" filter="url(#sBr1)" opacity="0.5"></rect>
    </g>
  </svg>
    <nav aria-label="Menu" style="position: absolute; left: 0; right: 0; top: 0; height: 70px; z-index: 5; display: flex; align-items: center; padding: 0 12px; background: rgba(7,5,13,.9); border-bottom: 1px solid rgba(201,248,255,.5); box-shadow: 0 1px 16px rgba(25,227,255,.35)">
      <a href="#" class="tab" style="border: 1px solid #ffffff; color: #ffffff; min-height: 46px; font-size: 20px"><b>&lsaquo; BACK TO THE BOARD</b></a>
    </nav>
    <section style="position: absolute; left: 16px; top: 90px; width: 358px">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; padding-right: 8px">
        <h3 class="sec" style="margin: 0">CLASS</h3>
        <div style="display: flex; align-items: center; gap: 10px"><span style="font: 800 22px 'Barlow Condensed', sans-serif; letter-spacing: 2px; color: #c9f8ff">1 OF 5</span><button class="btn" aria-label="Previous" disabled style="min-height: 44px; padding: 0 14px; opacity: .45"><b>&lsaquo;</b></button><button class="btn" aria-label="Next" style="min-height: 44px; padding: 0 14px"><b>&rsaquo;</b></button></div>
      </div>
      <div style="display: flex; gap: 14px; width: 600px"><label class="cls on" style="--c: #3aa0ff; width: 300px"><input type="radio" name="cls" checked><h4>FACE</h4><div aria-hidden="true" style="display: grid; grid-template-columns: 26px 26px; gap: 4px; margin-top: 12px"><span style="width: 26px; height: 26px; box-sizing: border-box; display: grid; place-items: center; font: 800 15px 'Barlow Condensed', sans-serif; border: 1px solid rgba(241,236,255,.3)"></span><span style="width: 26px; height: 26px; box-sizing: border-box; display: grid; place-items: center; font: 800 15px 'Barlow Condensed', sans-serif; background: #3aa0ff; color: #07050d">+</span><span style="width: 26px; height: 26px; box-sizing: border-box; display: grid; place-items: center; font: 800 15px 'Barlow Condensed', sans-serif; border: 1px dashed #ff5c8a; color: #ff5c8a">&minus;</span><span style="width: 26px; height: 26px; box-sizing: border-box; display: grid; place-items: center; font: 800 15px 'Barlow Condensed', sans-serif; border: 1px solid rgba(241,236,255,.3)"></span></div><p>The crowd's favorite. Earns from excited, positive reactions, and from the cheers a post draws after its Sweet card lands there.</p><p class="hurt">Hurt by bored reactions, and by a card that outdraws the post it was played on.</p></label><label class="cls" style="--c: #ff3d6e"><input type="radio" name="cls"><h4>HEEL</h4><div aria-hidden="true" style="display: grid; grid-template-columns: 26px 26px; gap: 4px; margin-top: 12px"><span style="width: 26px; height: 26px; box-sizing: border-box; display: grid; place-items: center; font: 800 15px 'Barlow Condensed', sans-serif; background: #ff3d6e; color: #07050d">+</span><span style="width: 26px; height: 26px; box-sizing: border-box; display: grid; place-items: center; font: 800 15px 'Barlow Condensed', sans-serif; border: 1px solid rgba(241,236,255,.3)"></span><span style="width: 26px; height: 26px; box-sizing: border-box; display: grid; place-items: center; font: 800 15px 'Barlow Condensed', sans-serif; border: 1px solid rgba(241,236,255,.3)"></span><span style="width: 26px; height: 26px; box-sizing: border-box; display: grid; place-items: center; font: 800 15px 'Barlow Condensed', sans-serif; border: 1px dashed #ff5c8a; color: #ff5c8a">&minus;</span></div><p>Earns heat: excited, negative reactions, and a Salty card that outdraws the post it lands on.</p><p class="hurt">Hurt by the polite shrug, calm and positive.</p></label></div>
      <p class="note" style="font-size: 19px">Only you will know its class, unless you choose to reveal it.</p>
      <h3 class="sec" style="margin-top: 30px">WHEN IT DEBUTS</h3>
      <label class="opt on"><input type="radio" name="pw" checked><b>DROP NOW</b><span>It is on the board at once, and can post at once.</span></label>
    </section>
  </figure>
  <figure aria-label="Debut, as a sheet" style="margin: 0; width: 390px; height: 844px; position: relative; overflow: hidden; background: #07050d; color: #f1ecff; flex: none">
    <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(7,5,13,.72)"></div>
    <section class="piece" style="position: absolute; left: 0; right: 0; top: 40px; bottom: 0; padding: 22px 16px; --cut: 20px; --edge: #19e3ff; --ground: #07050d">
      <button class="btn" aria-label="Close" style="position: absolute; right: 16px; top: 18px; min-height: 46px; width: 46px; padding: 0; transform: none"><b style="transform: none; font: 400 26px/1 'Barlow Condensed', sans-serif">&times;</b></button>
      <p style="margin: 0; font: 800 18px 'Barlow Condensed', sans-serif; letter-spacing: 2px; color: #19e3ff">MY CHARACTERS &rsaquo; DEBUT</p>
      <h2 style="margin: 4px 60px 18px 0; font: 34px/1.05 Anton, Impact, sans-serif">HOW WAITING WANDA DEBUTS</h2>
      <div style="display: grid; gap: 10px"><label class="opt"><input type="radio" name="pd"><b>SILENT</b><span>Nobody is told. Waiting Wanda simply appears.</span></label><label class="opt on"><input type="radio" name="pd" checked><b>ANNOUNCED</b><span>The System posts that Waiting Wanda debuts, never as what.</span></label><label class="opt"><input type="radio" name="pd"><b>ANNOUNCED, WITH ITS CLASS</b><span>The System also says what class Waiting Wanda is. This can't be taken back.</span></label></div>
      <div class="btns" style="position: absolute; left: 16px; right: 16px; bottom: 18px; justify-content: stretch"><button class="btn" style="flex: 1"><b>CANCEL</b></button><button class="btn primary" style="flex: 2"><b>SAVE</b></button></div>
    </section>
  </figure>
  <figure aria-label="Edit profile" style="margin: 0; width: 390px; height: 844px; position: relative; overflow: hidden; background: #07050d; color: #f1ecff; flex: none">
    <svg aria-hidden="true" width="390" height="844" style="position: absolute; left: 0; top: 0">
    <defs>
      <filter id="sAr3" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.0022 0.004" numOctaves="5" seed="23"></feTurbulence><feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.14  0 0 0 0 0.98  1.8 0 0 0 -0.74"></feColorMatrix><feGaussianBlur stdDeviation="18"></feGaussianBlur></filter>
      <filter id="sBr3" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.003 0.005" numOctaves="4" seed="61"></feTurbulence><feColorMatrix type="matrix" values="0 0 0 0 0.08  0 0 0 0 0.85  0 0 0 0 1  0 2 0 0 -1.0"></feColorMatrix><feGaussianBlur stdDeviation="18"></feGaussianBlur></filter>
      <filter id="softr3" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="30"></feGaussianBlur></filter>
      <mask id="calmr3" maskUnits="userSpaceOnUse" x="0" y="0" width="390" height="844">
        <rect width="390" height="844" fill="#ffffff"></rect>
        <rect x="0" y="220" width="390" height="600" fill="#000000" opacity="0.9" filter="url(#softr3)"></rect>
      </mask>
    </defs>
    <g mask="url(#calmr3)">
      <rect width="390" height="844" filter="url(#sAr3)" opacity="0.95"></rect>
      <rect width="390" height="844" filter="url(#sBr3)" opacity="0.5"></rect>
    </g>
  </svg>
    <nav aria-label="Menu" style="position: absolute; left: 0; right: 0; top: 0; height: 70px; z-index: 5; display: flex; align-items: center; padding: 0 12px; background: rgba(7,5,13,.9); border-bottom: 1px solid rgba(201,248,255,.5); box-shadow: 0 1px 16px rgba(25,227,255,.35)">
      <a href="#" class="tab" style="border: 1px solid #ffffff; color: #ffffff; min-height: 46px; font-size: 20px"><b>&lsaquo; BACK TO THE BOARD</b></a>
    </nav><h1 style="position: absolute; left: 16px; top: 92px; width: 358px; margin: 0; font: 64px/1 Anton, Impact, sans-serif; letter-spacing: .5px; text-shadow: 0 0 24px rgba(25,227,255,.35)">EDIT MRS.<br>HOOLIGAN</h1>
    <form style="position: absolute; left: 16px; top: 236px; width: 358px">
      <p class="lead" style="font-size: 20px; font-weight: 500">What you set here is public: it shows beside Mrs. Hooligan's posts.</p>
      <div class="field" style="margin-top: 20px"><label>TITLE</label><input type="text" value="Magenta enthusiast (classier)"><div class="count"><span></span><span>29 of 40</span></div></div>
      <div class="field" style="margin-top: 18px"><label>SIGNATURE</label><textarea style="box-sizing: border-box; width: 100%; height: 96px; padding: 10px 14px; background: rgba(18,12,36,.9); border: 1px solid #19e3ff; color: #f1ecff; font: 600 20px/1.4 'Barlow Condensed', sans-serif">[i]not the ink. never the ink.[/i]</textarea><div class="count"><span>BBCode, as in a post.</span><span>34 of 500</span></div></div>
      <div class="btns" style="margin-top: 18px"><button class="btn primary" style="width: 100%"><b>SAVE THE PROFILE</b></button></div>
    </form>
  </figure>
  <figure aria-label="My characters" style="margin: 0; width: 390px; height: 844px; position: relative; overflow: hidden; background: #07050d; color: #f1ecff; flex: none">
    <svg aria-hidden="true" width="390" height="844" style="position: absolute; left: 0; top: 0">
    <defs>
      <filter id="sAr4" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.0022 0.004" numOctaves="5" seed="23"></feTurbulence><feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.14  0 0 0 0 0.98  1.8 0 0 0 -0.74"></feColorMatrix><feGaussianBlur stdDeviation="18"></feGaussianBlur></filter>
      <filter id="sBr4" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.003 0.005" numOctaves="4" seed="61"></feTurbulence><feColorMatrix type="matrix" values="0 0 0 0 0.08  0 0 0 0 0.85  0 0 0 0 1  0 2 0 0 -1.0"></feColorMatrix><feGaussianBlur stdDeviation="18"></feGaussianBlur></filter>
      <filter id="softr4" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="30"></feGaussianBlur></filter>
      <mask id="calmr4" maskUnits="userSpaceOnUse" x="0" y="0" width="390" height="844">
        <rect width="390" height="844" fill="#ffffff"></rect>
        <rect x="0" y="260" width="390" height="140" fill="#000000" opacity="0.85" filter="url(#softr4)"></rect>
      </mask>
    </defs>
    <g mask="url(#calmr4)">
      <rect width="390" height="844" filter="url(#sAr4)" opacity="0.95"></rect>
      <rect width="390" height="844" filter="url(#sBr4)" opacity="0.5"></rect>
    </g>
  </svg>
    <nav aria-label="Menu" style="position: absolute; left: 0; right: 0; top: 0; height: 70px; z-index: 5; display: flex; align-items: center; padding: 0 12px; background: rgba(7,5,13,.9); border-bottom: 1px solid rgba(201,248,255,.5); box-shadow: 0 1px 16px rgba(25,227,255,.35)">
      <a href="#" class="tab" style="border: 1px solid #ffffff; color: #ffffff; min-height: 46px; font-size: 20px"><b>&lsaquo; BACK TO THE BOARD</b></a>
    </nav>
    <h1 style="position: absolute; left: 16px; top: 92px; margin: 0; font: 60px/1 Anton, Impact, sans-serif; text-shadow: 0 0 24px rgba(25,227,255,.35)">YOUR<br>CHARACTERS</h1>
    <p style="position: absolute; left: 16px; top: 222px; margin: 0; font: 30px Anton, Impact, sans-serif; color: #e4def7">3 OF 6</p>
    <p class="lead" style="position: absolute; left: 16px; top: 272px; width: 358px; font-size: 20px">This page is out of character and only you can see it. Classes are shown here and nowhere else unless you reveal them.</p>
  </figure>
</div>
</body>
</html>
