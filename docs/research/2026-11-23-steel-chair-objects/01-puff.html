<title>Steel Chair puff bench</title>
<!--
  Record, written 2026-11-23. A throwaway bench for docs/plans/2026-11-23-steel-chair-objects-design.md, section 4: the fire extinguisher's
  puff, to judge by eye before it is drawn by the effect. Not product code. What the owner approves is copied into
  instances/divided-world/ui/steel-chair/puff.ts.
  Its fog is the Hot Box fog bench's (docs/research/2026-11-15-hot-box-fog/01-fog.html): makeCloud, advect, step and drawFog are copied from it,
  with these changes. The field starts empty and the model's target is the puff's (clear outside the billow's front, fog inside), less the
  pointer's clearing; the whole box is stepped while it runs; a radial push from the spout runs for the jet; the opacity is the puff's, and
  the pointer clears as in Hot Box. The pointer's clearing is the fog bench's, minus the Lens sweep.
    jet / billow / hold / fade : the milliseconds of puffAlpha, puffFront and puffDone in puff.ts. full : the opacity of whole fog.
  ?auto=1 plays the puff over and over, and ?x=0.8&y=1 sets the extinguisher's place (0 to 1 of the box).
-->
<style>

  <div class="body" id="body"><div id="words"></div><div class="can" id="can"></div><canvas id="cv"></canvas></div>

<p id="stats"></p>
<script>
(() => {
  const q = new URLSearchParams(location.search);

  const PARAS = [
    'Okay, I have thought about this for three days and I am ready to say it: the water level in the second game is good, actually. You are all just bad at swimming.',
    'The music carries it. The frog suit carries it. The part where the big fish eats you is a skill issue and I will not be taking questions.',
    'In conclusion: world 3 is the best world, the sun is a coward, and this thread should be pinned.',
  ];
  /* The model, as steel-chair/puff.ts has it (the sliders move the numbers). */
  const P_ = { color: '#f2f4f7', jetMs: 250, billowMs: 600, holdMs: 400, fadeMs: 4000, full: 0.9 };

  const state = { mouse: null, rest: [], touch: null, pvx: 0, pvy: 0, lastMove: 0 };

  const holeRadius = () => Math.max(SMOKE.holeMin, Math.min(SMOKE.hole, W * SMOKE.holeShare));

  /* ------------------------------------------------------------------ the fog (the fog bench's, changed as the header says) ---- */
  /* ------------------------------------------------------------------ the proposed fog ---- */
  const T = 256;
  /** A tileable cloud: five octaves of value noise, and beside it the same cloud lit from the upper left (its height less the height a step toward the light). */

    for (let oct = 0; oct < 5; oct++) {
      const m = 4 << oct, g = new Float32Array(m * m);
      for (let i = 0; i < g.length; i++) g[i] = rnd();
      const s = m / T;
      for (let y = 0; y < T; y++) for (let x = 0; x < T; x++) {
        const fx = x * s, fy = y * s, x0 = Math.floor(fx), y0 = Math.floor(fy), tx = smooth(fx - x0), ty = smooth(fy - y0);
        const a = g[(y0 % m) * m + (x0 % m)], b = g[(y0 % m) * m + ((x0 + 1) % m)], c = g[((y0 + 1) % m) * m + (x0 % m)], d = g[((y0 + 1) % m) * m + ((x0 + 1) % m)];
        n[y * T + x] += amp * (a + (b - a) * tx + (c - a) * ty + (a - b - c + d) * tx * ty);

    for (let i = 0; i < n.length; i++) n[i] = clamp((n[i] / total - 0.5) * 1.9 + 0.5, 0, 1);
    for (let y = 0; y < T; y++) for (let x = 0; x < T; x++) lit[y * T + x] = n[y * T + x] - n[((y + T - 5) % T) * T + ((x + T - 4) % T)];

    const t1 = new Float32Array(T * T), t2 = new Float32Array(T * T);
    for (let i = 0; i < n.length; i++) { t1[i] = lit[i] * 1.1 + (n[i] - 0.5) * 0.1; t2[i] = lit[i] * 1.9 + (n[i] - 0.5) * 0.3; }
    return { n, lit, t1, t2 };
  }
  const cloud = makeCloud(20261115);
  function sample(tile, x, y) {
    const x0 = Math.floor(x), y0 = Math.floor(y), tx = x - x0, ty = y - y0, xa = x0 & 255, xb = (x0 + 1) & 255, ya = (y0 & 255) << 8, yb = ((y0 + 1) & 255) << 8;
    const a = tile[ya | xa], b = tile[ya | xb], c = tile[yb | xa], d = tile[yb | xb];

  let CELL = 5, gw = 0, gh = 0, D, D0, U, V, U0, V0, OX, OY, OX0, OY0, P, DIV, off, offCtx, img;
  function alloc() {
    CELL = +$('cell').value;
    gw = Math.ceil(W / CELL) + 1; gh = Math.ceil(H / CELL) + 1;
    const n = gw * gh, f = () => new Float32Array(n);
    D = f(); D0 = f(); U = f(); V = f(); U0 = f(); V0 = f(); OX = f(); OY = f(); OX0 = f(); OY0 = f(); P = f(); DIV = f();

  /** Semi-Lagrangian: each cell takes what the flow carried to it. `add` is added per unit of flow (the cloud's own offset moves with the fog). */

    for (let y = B.y0; y < B.y1; y++) for (let x = B.x0; x < B.x1; x++) {
      const i = y * gw + x, u = U0[i], v = V0[i];
      const px = clamp(x - u * dt, 0, gw - 1.001), py = clamp(y - v * dt, 0, gh - 1.001);
      const x0 = px | 0, y0 = py | 0, tx = px - x0, ty = py - y0, j = y0 * gw + x0;
      const a = src[j], b = src[j + 1], c = src[j + gw], d = src[j + gw + 1];

  /* The disturbed box, in cells: everything outside it is fog at rest and is not stepped. Null when the whole field is at rest. */
  let box = null;
  function step(dt, now, r0, r1) {
    const R = holeRadius(), cs = clearings(now), wake = $('wake').value / 100, rc = (R * 1.5) / CELL;
    /* The puff disturbs the whole content area while it runs, so the whole field is stepped (the build's `view` keeps it to the rows on screen). */
    const B = { x0: 1, x1: gw - 1, y0: Math.max(1, r0), y1: Math.min(gh - 1, r1) };
    if (B.x1 <= B.x0 || B.y1 <= B.y0) { box = null; return 0; }
    const ms = now - puffStart, sp = spout(), jetting = ms < P_.jetMs, sx = sp.x / CELL, sy = sp.y / CELL, front = puffFront(sp, { width: W, height: H }, ms);
    const tf = puffTarget(sp, { width: W, height: H }, ms);
    /* What moves it: each clearing that is moving drags the fog around it along. */
    for (const c of cs) {
      if (c.none) continue;
      const moving = c === state.mouse ? [state.pvx, state.pvy] : c.vx ? [c.vx, 0] : null;
      const burst = c === state.touch && now - c.openedAt < 260;
      if (!moving && !burst) continue;
      const cx = c.x / CELL, cy = c.y / CELL;
      const ya = Math.max(B.y0, Math.floor(cy - rc)), yb = Math.min(B.y1, Math.ceil(cy + rc)), xa = Math.max(B.x0, Math.floor(cx - rc)), xb = Math.min(B.x1, Math.ceil(cx + rc));

    for (let y = B.y0; y < B.y1; y++) for (let x = B.x0; x < B.x1; x++) { const i = y * gw + x; DIV[i] = 0.5 * (U[i + 1] - U[i - 1] + V[i + gw] - V[i - gw]); P[i] = 0; }

    const keep = jetting || (state.touch && now - state.touch.openedAt < 260) ? 0.35 : 1;
    for (let y = B.y0; y < B.y1; y++) for (let x = B.x0; x < B.x1; x++) { const i = y * gw + x; U[i] -= keep * 0.5 * (P[i + 1] - P[i - 1]); V[i] -= keep * 0.5 * (P[i + gw] - P[i - gw]); }
    U0.set(U); V0.set(V); D0.set(D); OX0.set(OX); OY0.set(OY);
    advect(U, U0, dt, B, 0); advect(V, V0, dt, B, 0); advect(D, D0, dt, B, 0); advect(OX, OX0, dt, B, 1); advect(OY, OY0, dt, B, 2);
    const damp = Math.exp(-dt / 0.9), settle = Math.exp(-dt / 3.5), sink = 1 - Math.exp(-dt / 0.07);

    for (let y = B.y0; y < B.y1; y++) for (let x = B.x0; x < B.x1; x++) {

      const target = Math.min(tf((x + 0.5) * CELL, (y + 0.5) * CELL), cs.length ? 1 - clearAt((x + 0.5) * CELL, (y + 0.5) * CELL, cs, now, R, false) : 1);

  function drawFog(t, now, r0, r1) {

      const i = y * gw + x, wx = (x + 0.5) * CELL, wy = (y + 0.5) * CELL;
      const d = reduced ? (cs.length ? 1 - clearAt(wx, wy, cs, now, R, true) : 1) : D[i];
      if (d <= 0.002) { px[o + 3] = 0; o += 4; continue; }

  /* ------------------------------------------------------------------ the page ---- */
  function replay() { alloc(); box = null; puffStart = performance.now(); }
  function reset() {

    P_.jetMs = +$('jet').value; P_.billowMs = +$('billow').value; P_.holdMs = +$('hold').value; P_.fadeMs = +$('fade').value; P_.full = $('full').value / 100;
    for (const id of ['jet', 'billow', 'hold', 'fade']) $(id + 'Text').textContent = $(id).value + ' ms';
    $('fullText').textContent = P_.full.toFixed(2); $('wakeText').textContent = ($('wake').value / 100).toFixed(2) + ' s'; $('cellText').textContent = $('cell').value + ' px';

  }
  for (const id of ['jet', 'billow', 'hold', 'fade', 'full', 'wake', 'cell', 'cx', 'cy']) $(id).addEventListener('input', reset);
  $('replay').addEventListener('click', replay);
  addEventListener('resize', reset);

  const at = (e) => { const r = body.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  function moveTo(x, y, now) {
    const m = state.mouse;
    if (m) { const dt = Math.max(1, now - state.lastMove) / 1000, k = 0.5; state.pvx += ((x - m.x) / dt - state.pvx) * k; state.pvy += ((y - m.y) / dt - state.pvy) * k; }

  body.addEventListener('pointerleave', (e) => { if (e.pointerType !== 'touch' && state.mouse) { state.rest.push({ ...state.mouse, leftAt: performance.now() }); state.mouse = null; state.pvx = state.pvy = 0; } });

  let last = performance.now(), acc = 0, frames = 0;
  function frame(now) {
    const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
    if (now - state.lastMove > 60) { state.pvx *= 0.6; state.pvy *= 0.6; }
    state.rest = state.rest.filter((c) => now < c.leftAt + c.hold + SMOKE.roll);
    const ms = now - puffStart, t0 = performance.now();
    ctx.clearRect(0, 0, W, H);
    let stepped = 0;
    if (puffDone(ms)) { if ($('loop').checked || q.get('auto')) replay(); }
    else { stepped = step(dt, now, 0, gh); drawFog(now, now, 0, gh); }
    acc += performance.now() - t0; frames++;
    if (frames === 30) { $('stats').textContent = `${Math.round(Math.min(ms, 99999))} ms; ${(acc / 30).toFixed(2)} ms a frame in script, ${gw} x ${gh} cells of ${CELL} px, ${stepped} stepped; body ${Math.round(W)} x ${Math.round(H)} px; alpha ${puffAlpha(ms).toFixed(2)}`; acc = 0; frames = 0; }
    requestAnimationFrame(frame);
  }
  if (q.get('x')) $('cx').value = Math.round(q.get('x') * 100);
  if (q.get('y')) $('cy').value = Math.round(q.get('y') * 100);
  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
