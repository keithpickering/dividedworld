<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Divided World's coin (B1): the board above, the glass below, and the seam between them is the bar of a division sign.
       The seam's rows sit on whole pixels at 32px (y 30 to 34 of 64). docs/plans/2026-11-02-favicon-design.md -->
  <defs>
    <clipPath id="c"><circle cx="32" cy="32" r="30"/></clipPath>
    <radialGradient id="g" cx="0.5" cy="1" r="0.9"><stop offset="0" stop-color="#8c24fa"/><stop offset="0.6" stop-color="#4a189a"/><stop offset="1" stop-color="#2a0f55"/></radialGradient>
    <filter id="glow" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>
  <g clip-path="url(#c)">
    <rect width="64" height="32" fill="#fff"/>
    <rect y="32" width="64" height="32" fill="url(#g)"/>
    <rect y="30" width="64" height="4" fill="#19e3ff" filter="url(#glow)"/>
    <rect y="30" width="64" height="2" fill="#c9f8ff"/>
    <rect y="32" width="64" height="2" fill="#19e3ff"/>
  </g>
  <circle cx="32" cy="32" r="30" fill="none" stroke="#07050d" stroke-width="3"/>
  <circle cx="32" cy="16" r="6" fill="#07050d"/>
  <circle cx="32" cy="48" r="6" fill="#f1ecff"/>
</svg>
